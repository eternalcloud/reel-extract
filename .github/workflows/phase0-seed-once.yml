name: Phase 0 Seed Once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  seed:
    if: contains(github.event.head_commit.message, '[phase0-seed-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production endpoint and seed
        shell: bash
        run: |
          set -euo pipefail

          url="https://reel-extract.vercel.app/api/admin/phase0/seed-once"
          response=""
          success=0

          for _ in $(seq 1 72); do
            code="$(
              curl -sS                 -o /tmp/phase0-seed-response.json                 -w '%{http_code}'                 -X POST                 "$url" || true
            )"

            if [ "$code" = "200" ]; then
              response="$(cat /tmp/phase0-seed-response.json)"
              success=1
              break
            fi

            sleep 5
          done

          if [ "$success" != "1" ]; then
            echo "Phase 0 seed endpoint did not succeed." >&2
            if [ -f /tmp/phase0-seed-response.json ]; then
              cat /tmp/phase0-seed-response.json >&2
            fi
            exit 1
          fi

          job_id="$(jq -r '.jobId' <<< "$response")"
          attempt="$(jq -r '.attempt' <<< "$response")"
          expires_at="$(jq -r '.expiresAt' <<< "$response")"
          disposition="$(jq -r '.disposition' <<< "$response")"

          {
            echo "## Phase 0 seeded"
            echo "- Job ID: `$job_id`"
            echo "- Attempt: `$attempt`"
            echo "- Expires: `$expires_at`"
            echo "- Disposition: `$disposition`"
            echo "- Fragment secret intentionally omitted from CI output."
          } >> "$GITHUB_STEP_SUMMARY"
